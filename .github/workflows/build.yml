name: Build .NET project       # klucz i wartość

on:                            # obiekt zagnieżdżony
  workflow_dispatch:
env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:                     # lista
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Show directory
        run: pwd
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: bash
        run: dotnet restore "Warp07.demo"

      - name: Build project
        shell: bash
        run: dotnet build "Warp07.demo" --configuration Release --no-restore